<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 520" width="650" height="520" role="img" aria-label="Girl coding at a desk with three monitors">
  <title>Girl coding at a desk with three monitors</title>
  <defs>
    <pattern id="mesh" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#D6DDFF"/>
      <path d="M0 0V10M0 0H10" stroke="#4F6BED" stroke-width="2.4"/>
    </pattern>
    <clipPath id="midScreen"><rect x="203" y="147" width="114" height="71" rx="2"/></clipPath>
  </defs>

  <style>
    .type { transform-box: fill-box; transform-origin: left center; animation: type 4.8s ease-in-out infinite; }
    @keyframes type { 0% { transform: scaleX(0) } 30%, 80% { transform: scaleX(1) } 92%, 100% { transform: scaleX(0) } }
    .gear { transform-box: fill-box; transform-origin: center; animation: spin 4s linear infinite; }
    .gear.rev { animation-direction: reverse; animation-duration: 3s; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .hand { animation: tap .35s ease-in-out infinite alternate; }
    @keyframes tap { to { transform: translateY(2px) } }
    .head { transform-box: fill-box; transform-origin: 50% 90%; animation: nod 3.2s ease-in-out infinite; }
    @keyframes nod { 50% { transform: rotate(-2deg) } }
    .pony { transform-box: fill-box; transform-origin: 0% 0%; animation: sway 2.4s ease-in-out infinite; }
    @keyframes sway { 50% { transform: rotate(6deg) } }
    .bubble { animation: float 3s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-4px) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>

  <!-- floor -->
  <ellipse cx="320" cy="478" rx="290" ry="20" fill="#F3F4F8"/>

  <!-- floating code lines -->
  <g fill="#C7D0FF">
    <rect class="type" x="84"  y="80"  width="40" height="3" rx="1.5" style="animation-delay:0s"/>
    <rect class="type" x="84"  y="89"  width="30" height="3" rx="1.5" style="animation-delay:.2s"/>
    <rect class="type" x="92"  y="98"  width="34" height="3" rx="1.5" style="animation-delay:.4s"/>
    <rect class="type" x="84"  y="107" width="26" height="3" rx="1.5" style="animation-delay:.6s"/>
    <rect class="type" x="92"  y="116" width="38" height="3" rx="1.5" style="animation-delay:.8s"/>
    <rect class="type" x="84"  y="125" width="22" height="3" rx="1.5" style="animation-delay:1s"/>
    <rect class="type" x="134" y="80"  width="92" height="3" rx="1.5" style="animation-delay:.1s"/>
    <rect class="type" x="134" y="89"  width="70" height="3" rx="1.5" style="animation-delay:.3s"/>
    <rect class="type" x="144" y="98"  width="84" height="3" rx="1.5" style="animation-delay:.5s"/>
    <rect class="type" x="144" y="107" width="60" height="3" rx="1.5" style="animation-delay:.7s"/>
    <rect class="type" x="134" y="116" width="96" height="3" rx="1.5" style="animation-delay:.9s"/>
    <rect class="type" x="144" y="125" width="52" height="3" rx="1.5" style="animation-delay:1.1s"/>
    <rect class="type" x="256" y="64"  width="118" height="3" rx="1.5" style="animation-delay:.15s"/>
    <rect class="type" x="266" y="73"  width="104" height="3" rx="1.5" style="animation-delay:.35s"/>
    <rect class="type" x="256" y="82"  width="120" height="3" rx="1.5" style="animation-delay:.55s"/>
    <rect class="type" x="276" y="91"  width="96" height="3" rx="1.5" style="animation-delay:.75s"/>
    <rect class="type" x="266" y="100" width="150" height="3" rx="1.5" style="animation-delay:.95s"/>
    <rect class="type" x="256" y="109" width="132" height="3" rx="1.5" style="animation-delay:1.15s"/>
    <rect class="type" x="276" y="118" width="112" height="3" rx="1.5" style="animation-delay:1.35s"/>
  </g>

  <!-- speech bubble with gears -->
  <g class="bubble">
    <rect x="378" y="54" width="54" height="48" rx="7" fill="#4F6BED"/>
    <path d="M392 101 L396 116 L406 101 Z" fill="#4F6BED"/>
    <g class="gear">
      <circle cx="398" cy="74" r="8" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="3.2 2.1"/>
      <circle cx="398" cy="74" r="6" fill="#FFFFFF"/>
      <circle cx="398" cy="74" r="2.6" fill="#4F6BED"/>
    </g>
    <g class="gear rev">
      <circle cx="415" cy="85" r="5.5" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="2.4 1.6"/>
      <circle cx="415" cy="85" r="4" fill="#FFFFFF"/>
      <circle cx="415" cy="85" r="1.8" fill="#4F6BED"/>
    </g>
  </g>

  <!-- right monitor (behind girl) -->
  <rect x="332" y="138" width="106" height="92" rx="5" fill="#2B2F3A"/>
  <rect x="339" y="145" width="92" height="76" rx="2" fill="#5B6FD8"/>
  <g fill="#C7D0FF"><rect x="372" y="154" width="50" height="3"/><rect x="372" y="163" width="40" height="3"/><rect x="372" y="172" width="54" height="3"/><rect x="372" y="181" width="36" height="3"/><rect x="372" y="190" width="48" height="3"/></g>

  <!-- left monitor -->
  <path d="M70 142 L190 138 L196 224 L80 227 Z" fill="#2B2F3A"/>
  <path d="M78 149 L183 146 L188 217 L86 220 Z" fill="#E9EDFF"/>
  <path d="M86 149 L118 148 L122 219 L90 220 Z" fill="#C7D0FF"/>
  <g fill="#2B2F3A">
    <rect x="128" y="160" width="40" height="2.5"/><rect x="128" y="167" width="30" height="2.5"/>
    <rect x="132" y="174" width="38" height="2.5"/><rect x="132" y="181" width="26" height="2.5"/>
    <rect x="128" y="188" width="42" height="2.5"/><rect x="128" y="195" width="20" height="2.5"/>
    <rect x="96" y="200" width="10" height="2.5"/>
  </g>
  <rect x="124" y="226" width="14" height="14" fill="#3A3F4E"/>
  <rect x="104" y="238" width="54" height="5" rx="2" fill="#3A3F4E"/>

  <!-- middle monitor -->
  <rect x="196" y="140" width="128" height="85" rx="5" fill="#2B2F3A"/>
  <rect x="203" y="147" width="114" height="71" rx="2" fill="#B8C3F5"/>
  <g clip-path="url(#midScreen)">
    <rect x="210" y="155" width="56" height="30" fill="#1F2433"/>
    <rect x="216" y="162" width="34" height="2.5" fill="#C7D0FF"/>
    <rect x="216" y="169" width="24" height="2.5" fill="#C7D0FF"/>
    <rect x="244" y="174" width="66" height="36" fill="#1F2433" stroke="#4F6BED" stroke-width="3"/>
    <rect x="252" y="184" width="40" height="2.5" fill="#C7D0FF"/>
    <rect x="252" y="191" width="30" height="2.5" fill="#C7D0FF"/>
    <rect class="blink" x="284" y="190" width="5" height="5" fill="#FFFFFF"/>
  </g>
  <rect x="252" y="225" width="14" height="14" fill="#3A3F4E"/>

  <!-- desk -->
  <rect x="64" y="241" width="380" height="9" rx="4.5" fill="#A9B4E8"/>
  <path d="M96 250 L84 470 L92 470 L106 250 Z" fill="#9EA3AE"/>
  <path d="M164 250 L176 470 L184 470 L172 250 Z" fill="#9EA3AE"/>
  <rect x="210" y="236" width="62" height="5" rx="2" fill="#3A3F4E"/>

  <!-- chair back -->
  <rect x="402" y="158" width="80" height="164" rx="20" fill="#5E6370"/>
  <path d="M422 158 h-0 a20 20 0 0 0 -20 20 v124 a20 20 0 0 0 20 20 h6 v-164 z" fill="#4F6BED"/>

  <!-- chair seat, stem, base -->
  <rect x="356" y="316" width="132" height="12" rx="6" fill="#8D929C"/>
  <path d="M330 286 h64 v8 h-56 v26 h-8 z" fill="#4A4E58"/>
  <rect x="414" y="328" width="12" height="106" fill="#6E737D"/>
  <path d="M362 438 L478 438 L478 446 L362 446 Z" fill="#3E424C"/>
  <circle cx="368" cy="458" r="8" fill="#2B2F3A"/>
  <circle cx="470" cy="458" r="8" fill="#2B2F3A"/>
  <rect x="366" y="444" width="5" height="10" fill="#3E424C"/>
  <rect x="468" y="444" width="5" height="10" fill="#3E424C"/>

  <!-- girl: legs -->
  <path d="M352 300 L410 300 Q414 322 396 326 L320 326 Q306 326 306 312 Q306 300 322 300 Z" fill="#23262F"/>
  <path d="M306 312 Q306 304 318 304 L332 304 L344 444 L326 444 Z" fill="#23262F"/>
  <rect x="324" y="438" width="22" height="8" fill="#4F6BED"/>
  <path d="M322 446 L350 446 Q362 446 362 456 L322 456 Z" fill="#2B2F3A"/>

  <!-- girl: torso -->
  <path d="M338 186 Q366 172 396 182 Q412 190 412 214 L412 304 L350 304 Q342 250 338 186 Z" fill="#4F6BED"/>
  <path d="M352 250 l12 -14 l12 14 l12 -14 l12 14 M356 270 l12 -14 l12 14 l12 -14 l12 14" fill="none" stroke="#7F95FF" stroke-width="3" stroke-linejoin="round"/>

  <!-- girl: hair falling down the back -->
  <path d="M352 150 Q390 140 398 176 Q404 214 392 248 Q380 232 374 210 Q364 186 352 172 Z" fill="#1E2230"/>

  <!-- girl: arm and hand -->
  <path d="M342 190 Q326 194 312 214 L296 232 L304 240 L324 222 Q340 208 352 204 Z" fill="#C9D2FF"/>
  <g class="hand">
    <path d="M296 230 Q286 232 272 233 Q266 234 266 238 L300 240 Z" fill="#F2C6A0"/>
  </g>

  <!-- girl: head, bun ponytail -->
  <g class="head">
    <circle cx="350" cy="146" r="22" fill="#1E2230"/>
    <path d="M330 146 Q328 164 342 170 L346 156 Z" fill="#F2C6A0"/>
    <path d="M330 140 Q330 126 344 124 Q336 134 336 146 Z" fill="#2D3244"/>
    <rect x="326" y="146" width="16" height="3" rx="1.5" fill="#1E2230"/>
    <circle cx="331" cy="148" r="5" fill="none" stroke="#1E2230" stroke-width="2"/>
    <g class="pony">
      <path d="M362 128 Q384 120 390 140 Q394 160 382 178 Q384 156 374 144 Q368 136 360 136 Z" fill="#1E2230"/>
    </g>
    <circle cx="364" cy="128" r="4" fill="#FFD84D"/>
  </g>

  <!-- waste bin -->
  <path d="M506 404 L578 404 L572 474 L512 474 Z" fill="url(#mesh)"/>
  <rect x="502" y="398" width="80" height="8" rx="3" fill="#4F6BED"/>
  <rect x="510" y="470" width="64" height="6" rx="2" fill="#4F6BED"/>
</svg>
